name: Release

# Publishes on a version tag, which `npm run release` creates and pushes.
# npm auth is OIDC (trusted publishing) rather than a token: the job proves its
# identity to npm with the `id-token` permission below, so no NPM_TOKEN is
# stored anywhere and a leaked secret can't publish this package.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for trusted publishing. Without it npm falls back to looking
      # for a token and the publish fails as unauthenticated.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1+, and the npm bundled with Node
      # ships older than that — without this the publish step looks for a token
      # that doesn't exist.
      #
      # Pinned to the 11 major rather than @latest: npm 12 requires Node
      # ^22.22.2 || ^24.15.0 || >=26, so `@latest` breaks this job every time
      # npm ships a major that outruns the Node line above. Raise both together.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Enable Corepack
        run: corepack enable

      # --immutable: a lockfile that disagrees with package.json fails here
      # rather than silently resolving a different SDK than the one tested.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # No NODE_AUTH_TOKEN: OIDC supplies the credential, and provenance is
      # attached automatically.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The hosted server at mcp.paragraph.com. Deploying it is already part of a
  # release (the old release.sh did it), so it stays part of one — but it is
  # skipped cleanly until CLOUDFLARE_API_TOKEN exists, so publishing to npm
  # never depends on Cloudflare credentials being configured first.
  deploy-worker:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set - skipping Worker deploy. Run 'yarn deploy' locally to update mcp.paragraph.com."
          fi

      - name: Enable Corepack
        if: steps.creds.outputs.ready == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: yarn install --immutable

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: yarn deploy
