name: Release

# Publishes on a version tag, which `npm run release` creates and pushes.
# npm auth is OIDC (trusted publishing) rather than a token: the job proves its
# identity to npm with the `id-token` permission below, so no NPM_TOKEN is
# stored anywhere and a leaked secret can't publish this package.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for trusted publishing. Without it npm falls back to looking
      # for a token and the publish fails as unauthenticated.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1+, and the npm bundled with Node
      # ships older than that — without this the publish step looks for a token
      # that doesn't exist.
      #
      # Pinned to the 11 major rather than @latest: npm 12 requires Node
      # ^22.22.2 || ^24.15.0 || >=26, so `@latest` breaks this job every time
      # npm ships a major that outruns the Node line above. Raise both together.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Enable Corepack
        run: corepack enable

      # --immutable: a lockfile that disagrees with package.json fails here
      # rather than silently resolving a different SDK than the one tested.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # No NODE_AUTH_TOKEN: OIDC supplies the credential, and provenance is
      # attached automatically.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The hosted server at mcp.paragraph.com is deployed by deploy-worker.yml,
  # which triggers on the same tag. Kept separate so a Cloudflare failure
  # cannot mark a successful npm publish red, and so a redeploy does not need
  # to burn a new version number.
